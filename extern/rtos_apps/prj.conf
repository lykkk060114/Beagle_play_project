CONFIG_PRINTK=y  # 开启 printk 支持
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

CONFIG_SENSOR=y # 开 zephyr 的传感器子系统
CONFIG_I2C=y    # 开 i2c 驱动支持
CONFIG_LOG=y    # 开日志系统支持

CONFIG_NETWORKING=y  # 开启网络支持
CONFIG_NET_IPV6=y  # 开启 IPv6 支持
CONFIG_NET_UDP=y  # 开启 UDP 支持
CONFIG_NET_SOCKETS=y  # 开启套接字支持
CONFIG_NET_SOCKETS_POSIX_NAMES=y  # 使用 POSIX 风格的套接

CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV6=y
CONFIG_NET_CONFIG_MY_IPV6_ADDR="2001:db8::1"

CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
