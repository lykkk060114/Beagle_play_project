<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agri Dashboard</title>
  <style>
    :root {
      --bg: #0b1118;
      --panel: #111a24;
      --panel-2: #172131;
      --line: #233142;
      --text: #e6eef8;
      --muted: #8c9db3;
      --ok: #39d98a;
      --warn: #f5c451;
      --bad: #ff6b6b;
      --accent: #5da9ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #091017 0%, #0b1118 100%);
      color: var(--text);
    }

    .wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--warn);
      box-shadow: 0 0 0 4px rgba(245, 196, 81, 0.12);
    }

    .dot.ok { background: var(--ok); box-shadow: 0 0 0 4px rgba(57, 217, 138, 0.12); }
    .dot.bad { background: var(--bad); box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.12); }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }

    .section {
      background: rgba(17, 26, 36, 0.95);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }

    .section h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-head h2 {
      margin: 0;
    }

    .metric {
      padding: 14px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      min-height: 92px;
    }

    .metric .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 10px;
    }

    .metric .value {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.1;
    }

    .metric .hint {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }

    .node-card {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }

    .node-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .node-id {
      font-size: 18px;
      font-weight: 700;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      border: 1px solid transparent;
    }

    .badge.ok { color: var(--ok); background: rgba(57, 217, 138, 0.12); border-color: rgba(57, 217, 138, 0.35); }
    .badge.warn { color: var(--warn); background: rgba(245, 196, 81, 0.12); border-color: rgba(245, 196, 81, 0.35); }
    .badge.bad { color: var(--bad); background: rgba(255, 107, 107, 0.12); border-color: rgba(255, 107, 107, 0.35); }

    .node-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .kv .k { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .kv .v { font-size: 16px; font-weight: 600; }
    .kv.good .v { color: var(--ok); }
    .kv.warn .v { color: var(--warn); }
    .kv.bad .v { color: var(--bad); }

    .actuator-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .actuator-card {
      min-height: 150px;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #0d1620;
      position: relative;
      overflow: hidden;
    }

    .actuator-card::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 4px;
      background: #304155;
    }

    .actuator-card.on::before { background: var(--ok); }
    .actuator-card.warn::before { background: var(--warn); }
    .actuator-card.off::before { background: #304155; }

    .actuator-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 14px;
    }

    .actuator-name {
      font-size: 15px;
      font-weight: 700;
    }

    .actuator-state {
      min-width: 78px;
      text-align: center;
      padding: 5px 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 700;
    }

    .actuator-state.on {
      color: var(--ok);
      border-color: rgba(57, 217, 138, 0.35);
      background: rgba(57, 217, 138, 0.12);
    }

    .actuator-state.off {
      color: var(--muted);
      background: rgba(255, 255, 255, 0.03);
    }

    .actuator-reason {
      min-height: 38px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.35;
    }

    .actuator-rule {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .meter {
      height: 8px;
      margin-top: 12px;
      border-radius: 999px;
      background: #182433;
      overflow: hidden;
    }

    .meter span {
      display: block;
      height: 100%;
      width: var(--level, 0%);
      background: var(--accent);
    }

    .meter.bad span { background: var(--bad); }
    .meter.warn span { background: var(--warn); }
    .meter.ok span { background: var(--ok); }

    .threshold-meter {
      margin-top: 12px;
    }

    .threshold-track {
      position: relative;
      height: 12px;
      border-radius: 999px;
      background: #182433;
      overflow: visible;
    }

    .threshold-range {
      position: absolute;
      top: 0;
      bottom: 0;
      left: var(--safe-start, 0%);
      width: var(--safe-width, 100%);
      border-radius: 999px;
      background: rgba(57, 217, 138, 0.24);
    }

    .threshold-marker {
      position: absolute;
      top: -3px;
      bottom: -3px;
      left: var(--pos, 0%);
      width: 2px;
      background: var(--marker-color, var(--warn));
      transform: translateX(-1px);
    }

    .threshold-current {
      position: absolute;
      top: 50%;
      left: var(--pos, 0%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #0d1620;
      background: var(--current-color, var(--accent));
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 3px rgba(93, 169, 255, 0.16);
    }

    .threshold-labels {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.3;
    }

    .threshold-labels span:nth-child(2) { text-align: center; }
    .threshold-labels span:nth-child(3) { text-align: right; }

    .manual-placeholder {
      color: var(--muted);
      padding: 12px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.02);
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #0d1620;
      color: var(--text);
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(93, 169, 255, 0.12);
    }

    input[type="range"] {
      accent-color: var(--accent);
      padding: 0;
    }

    .fan-pwm-control {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .fan-pwm-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .fan-pwm-value {
      color: var(--text);
      font-weight: 700;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      border: 1px solid var(--line);
      background: #13202d;
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }

    button:hover { transform: translateY(-1px); border-color: #39516b; }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    button.primary { background: rgba(93, 169, 255, 0.12); border-color: rgba(93, 169, 255, 0.4); }
    button.ok { background: rgba(57, 217, 138, 0.12); border-color: rgba(57, 217, 138, 0.35); }
    button.warn { background: rgba(245, 196, 81, 0.12); border-color: rgba(245, 196, 81, 0.35); }
    button.bad { background: rgba(255, 107, 107, 0.12); border-color: rgba(255, 107, 107, 0.35); }
    button.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px rgba(93, 169, 255, 0.35); }

    .events {
      max-height: 360px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .event {
      padding: 10px 12px;
      border-radius: 8px;
      background: #0d1620;
      border: 1px solid var(--line);
      font-size: 13px;
      color: var(--text);
    }

    .event.ok { border-color: rgba(57, 217, 138, 0.35); }
    .event.warn { border-color: rgba(245, 196, 81, 0.35); }
    .event.bad { border-color: rgba(255, 107, 107, 0.35); }
    .event small { display: block; color: var(--muted); margin-bottom: 4px; }

    .foot {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 1100px) {
      .grid-4, .grid-3, .form-grid, .actuator-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 720px) {
      header { flex-direction: column; align-items: flex-start; }
      .grid-4, .grid-3, .form-grid, .actuator-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>智能农业网页控制台</h1>
        <div class="subtitle">BeaglePlay UDP 网关 + 主机端后端 + 浏览器监控面板</div>
      </div>
      <div class="status-pill"><span id="connDot" class="dot"></span><span id="connText">等待状态</span></div>
    </header>

    <section class="section">
      <h2>系统总览</h2>
      <div class="grid-4">
        <div class="metric">
          <div class="label">系统运行</div>
          <div id="runningValue" class="value">-</div>
          <div class="hint">running</div>
        </div>
        <div class="metric">
          <div class="label">当前模式</div>
          <div id="modeValue" class="value">-</div>
          <div class="hint">auto / manual / safe</div>
        </div>
        <div class="metric">
          <div class="label">在线节点</div>
          <div id="onlineValue" class="value">-</div>
          <div class="hint">nodes online</div>
        </div>
        <div class="metric">
          <div class="label">网关状态</div>
          <div id="gatewayValue" class="value">-</div>
          <div class="hint">gateway</div>
        </div>
      </div>
      <div class="btn-row">
        <button class="ok" onclick="postNoBody('/api/system/start')">启动系统</button>
        <button class="bad" onclick="postNoBody('/api/system/stop')">停止系统</button>
        <button class="primary" onclick="postNoBody('/api/system/restart_gateway')">请求重启网关</button>
      </div>
      <div class="foot">最后更新时间：<span id="updatedAt">-</span></div>
    </section>

    <section class="section" style="margin-top:14px;">
      <h2>Freedom 节点实时数据</h2>
      <div id="nodeCards" class="cards"></div>
    </section>

    <section class="section" style="margin-top:14px;">
      <div class="section-head">
        <h2>自动执行器</h2>
        <span id="autoSummary" class="badge warn">等待状态</span>
      </div>
      <div id="actuatorCards" class="actuator-grid"></div>
    </section>

    <section class="grid-3" style="margin-top:14px;">
      <div class="section">
        <h2>阈值设置</h2>
        <div class="form-grid">
          <div class="field"><label>光照下限</label><input id="light_low" type="number" step="0.1"></div>
          <div class="field"><label>光照恢复值</label><input id="light_high" type="number" step="0.1"></div>
          <div class="field"><label>湿度下限</label><input id="humidity_low" type="number" step="0.1"></div>
          <div class="field"><label>温度上限</label><input id="temperature_high" type="number" step="0.1"></div>
          <div class="field"><label>喷水时长(秒)</label><input id="pump_duration_sec" type="number" step="1" min="0"></div>
          <div class="field"><label>喷水冷却(秒)</label><input id="pump_cooldown_sec" type="number" step="1" min="0"></div>
        </div>
        <div class="btn-row" style="margin-top:12px;">
          <button class="primary" onclick="saveConfig()">保存阈值</button>
        </div>
      </div>

      <div class="section">
        <h2>模式切换</h2>
        <div class="btn-row">
          <button id="mode_auto" class="primary" onclick="setMode('auto')">自动模式</button>
          <button id="mode_manual" class="primary" onclick="setMode('manual')">手动模式</button>
          <button id="mode_safe" class="warn" onclick="setMode('safe')">安全模式</button>
        </div>
        <div class="foot">safe 模式下后端会关闭全部执行器并拒绝控制请求。</div>
      </div>

      <div id="manualControl" class="section">
        <h2>手动控制</h2>
        <div id="manualControlPlaceholder" class="manual-placeholder">切换到手动模式后显示灯、水泵、风扇控制。</div>
        <div id="manualControlBody" class="hidden">
        <div class="btn-row">
          <button onclick="controlDevice('light','on')">开灯</button>
          <button onclick="controlDevice('light','off')">关灯</button>
          <button class="ok" onclick="controlDevice('pump','once')">喷水一次</button>
          <button class="bad" onclick="controlDevice('pump','off')">水泵急停</button>
          <button onclick="controlDevice('fan','on')">开风扇</button>
          <button onclick="controlDevice('fan','off')">关风扇</button>
        </div>
        <div class="fan-pwm-control">
          <div class="fan-pwm-head">
            <span>风扇 PWM</span>
            <span id="fanPwmValue" class="fan-pwm-value">50%</span>
          </div>
          <input id="fanPwmRange" type="range" min="0" max="100" step="1" value="50"
                 oninput="updateFanPwmPreview()" onchange="setFanPwmFromSlider()">
          <div id="fanPwmHint" class="foot">手动模式下可调；自动模式固定 50%。</div>
        </div>
        </div>
        <div class="foot">手动模式下才允许直接控制执行器。</div>
      </div>
    </section>

    <section class="section" style="margin-top:14px;">
      <h2>事件日志</h2>
      <div id="events" class="events"></div>
    </section>
  </div>

  <script>
    let latestStatus = null;

    function byId(id) {
      return document.getElementById(id);
    }

    function fmtBool(value) {
      return value ? 'ON' : 'OFF';
    }

    function fmtRunning(value) {
      return value === true ? '运行中' : '已停止';
    }

    function fmtTime(ms) {
      if (!ms) return '-';
      return new Date(ms).toLocaleString();
    }

    function fmtNumber(value, digits = 1) {
      if (value === null || value === undefined) return '-';
      const number = Number(value);
      return Number.isFinite(number) ? number.toFixed(digits) : '-';
    }

    function clampPercent(value, min, max) {
      const number = Number(value);
      if (!Number.isFinite(number) || max <= min) return 0;
      return Math.max(0, Math.min(100, ((number - min) / (max - min)) * 100));
    }

    function finiteOr(value, fallback) {
      const number = Number(value);
      return Number.isFinite(number) ? number : fallback;
    }

    function setConnection(ok, text) {
      byId('connText').textContent = text;
      const dot = byId('connDot');
      dot.className = 'dot' + (ok === true ? ' ok' : ok === false ? ' bad' : '');
    }

    function setInputIfIdle(id, value) {
      const el = byId(id);
      if (document.activeElement !== el) {
        el.value = value;
      }
    }

    function syncFanPwmControls(data) {
      const actuators = data.actuators || {};
      const mode = data.mode || 'manual';
      const range = byId('fanPwmRange');
      const manualPwm = Number(actuators.manual_fan_pwm_percent ?? 50);
      const autoPwm = Number(actuators.auto_fan_pwm_percent ?? 50);

      if (document.activeElement !== range) {
        range.value = manualPwm;
      }
      range.disabled = mode !== 'manual';

      byId('fanPwmValue').textContent = mode === 'auto' ? `固定 ${autoPwm}%` : `${range.value}%`;
      byId('fanPwmHint').textContent =
        mode === 'manual' ? '手动模式下可调，开风扇时按该 PWM 下发。' :
        mode === 'auto' ? `自动模式固定 ${autoPwm}%。` :
        '安全模式下不可调。';
    }

    function updateFanPwmPreview() {
      byId('fanPwmValue').textContent = `${byId('fanPwmRange').value}%`;
    }

    function updateModeButtons(mode) {
      for (const id of ['mode_auto', 'mode_manual', 'mode_safe']) {
        byId(id).classList.remove('active');
      }
      const activeId = mode === 'auto' ? 'mode_auto' : mode === 'manual' ? 'mode_manual' : 'mode_safe';
      byId(activeId).classList.add('active');
      byId('manualControlBody').classList.toggle('hidden', mode !== 'manual');
      byId('manualControlPlaceholder').classList.toggle('hidden', mode === 'manual');
      byId('fanPwmRange').disabled = mode !== 'manual';
    }

    function valueClass(kind, node, config) {
      if (kind === 'temperature' && Number(node.temperature) > Number(config.temperature_high)) return 'bad';
      if (kind === 'humidity' && Number(node.humidity) < Number(config.humidity_low)) return 'bad';
      if (kind === 'light' && Number(node.light) < Number(config.light_low)) return 'warn';
      if (kind === 'light' && Number(node.light) > Number(config.light_high)) return 'good';
      return '';
    }

    function renderNodes(nodes, config) {
      const host = byId('nodeCards');
      const keys = Object.keys(nodes || {});
      if (!keys.length) {
        host.innerHTML = '<div class="node-card"><div class="node-id">暂无节点数据</div><div class="foot">等待 BeaglePlay 发送 UDP JSON。</div></div>';
        return;
      }

      host.innerHTML = keys.map((key) => {
        const n = nodes[key];
        const online = !!n.online;
        const badgeClass = online ? 'ok' : 'bad';
        const stateText = online ? 'ONLINE' : 'OFFLINE';
        return `
          <div class="node-card">
            <div class="node-head">
              <div class="node-id">${key}</div>
              <span class="badge ${badgeClass}">${stateText}</span>
            </div>
            <div class="node-grid">
              <div class="kv ${valueClass('temperature', n, config)}"><div class="k">温度</div><div class="v">${fmtNumber(n.temperature)} ℃</div></div>
              <div class="kv ${valueClass('humidity', n, config)}"><div class="k">湿度</div><div class="v">${fmtNumber(n.humidity)} %</div></div>
              <div class="kv ${valueClass('light', n, config)}"><div class="k">光照</div><div class="v">${fmtNumber(n.light)}</div></div>
              <div class="kv"><div class="k">RSSI</div><div class="v">${Number(n.rssi).toFixed(0)} dBm</div></div>
            </div>
          </div>`;
      }).join('');
    }

    function onlineNodes(data) {
      return Object.values(data.nodes || {}).filter((node) => node.online);
    }

    function anyNode(nodes, fn) {
      return nodes.some((node) => fn(node));
    }

    function allNode(nodes, fn) {
      return nodes.length > 0 && nodes.every((node) => fn(node));
    }

    function thresholdMeter({ current, min, max, safeStart, safeEnd, markerStart, markerEnd, labels, currentClass }) {
      const start = finiteOr(min, 0);
      const end = Math.max(finiteOr(max, start + 1), start + 1);
      const currentPos = clampPercent(current, start, end);
      const safeStartPos = clampPercent(safeStart, start, end);
      const safeEndPos = clampPercent(safeEnd, start, end);
      const safeLeft = Math.min(safeStartPos, safeEndPos);
      const safeWidth = Math.max(0, Math.abs(safeEndPos - safeStartPos));
      const markerA = clampPercent(markerStart ?? safeStart, start, end);
      const markerB = clampPercent(markerEnd ?? safeEnd, start, end);
      const currentColor =
        currentClass === 'bad' ? 'var(--bad)' :
        currentClass === 'warn' ? 'var(--warn)' :
        currentClass === 'ok' ? 'var(--ok)' : 'var(--accent)';

      return `
        <div class="threshold-meter">
          <div class="threshold-track" style="--safe-start:${safeLeft}%; --safe-width:${safeWidth}%;">
            <span class="threshold-range"></span>
            <span class="threshold-marker" style="--pos:${markerA}%; --marker-color:var(--warn);"></span>
            <span class="threshold-marker" style="--pos:${markerB}%; --marker-color:var(--ok);"></span>
            <span class="threshold-current" style="--pos:${currentPos}%; --current-color:${currentColor};"></span>
          </div>
          <div class="threshold-labels">
            <span>${labels[0]}</span>
            <span>${labels[1]}</span>
            <span>${labels[2]}</span>
          </div>
        </div>`;
    }

    function renderActuators(data) {
      const host = byId('actuatorCards');
      const summary = byId('autoSummary');
      const actuators = data.actuators || {};
      const config = data.config || {};
      const online = onlineNodes(data);
      const nodes = online;
      const isAuto = data.running && data.mode === 'auto';
      const noNode = nodes.length === 0;

      summary.className = 'badge ' + (isAuto ? 'ok' : data.mode === 'safe' ? 'bad' : 'warn');
      summary.textContent = data.running ? (isAuto ? '自动模式运行中' : '系统运行中') : '系统已停止';

      const lightLow = anyNode(nodes, (node) => Number(node.light) < Number(config.light_low));
      const lightRecovered = allNode(nodes, (node) => Number(node.light) > Number(config.light_high));
      const tempHigh = anyNode(nodes, (node) => Number(node.temperature) > Number(config.temperature_high));
      const tempRecovered = allNode(nodes, (node) => Number(node.temperature) <= Number(config.temperature_high) - 2);
      const humidityLow = anyNode(nodes, (node) => Number(node.humidity) < Number(config.humidity_low));

      const minLight = noNode ? null : nodes.reduce((min, node) => Math.min(min, Number(node.light)), Number.POSITIVE_INFINITY);
      const maxTemp = noNode ? null : nodes.reduce((max, node) => Math.max(max, Number(node.temperature)), Number.NEGATIVE_INFINITY);
      const minHumidity = noNode ? null : nodes.reduce((min, node) => Math.min(min, Number(node.humidity)), Number.POSITIVE_INFINITY);
      const lightLowValue = finiteOr(config.light_low, 0);
      const lightHighValue = finiteOr(config.light_high, Math.max(lightLowValue + 1, 1));
      const tempHighValue = finiteOr(config.temperature_high, 30);
      const tempRecoverValue = tempHighValue - 2;
      const humidityLowValue = finiteOr(config.humidity_low, 0);
      const lightMax = Math.max(lightHighValue * 1.4, lightHighValue + 1, 1);
      const tempMin = Math.min(0, tempRecoverValue - 5);
      const tempMax = Math.max(tempHighValue + 5, 40);

      const cards = [
        {
          key: 'light',
          name: '补光灯',
          active: !!actuators.light,
          hot: isAuto && lightLow,
          reason: noNode ? '等待在线节点' :
            isAuto && lightLow ? '光照低于下限，补光灯开启' :
            isAuto && lightRecovered ? '光照已高于恢复值' :
            isAuto ? '光照处于阈值区间' : '由手动控制状态显示',
          rule: `当前最低 ${fmtNumber(minLight)} / 下限 ${fmtNumber(lightLowValue)} / 恢复 ${fmtNumber(lightHighValue)}`,
          meterHtml: noNode ? '' : thresholdMeter({
            current: minLight,
            min: 0,
            max: lightMax,
            safeStart: lightLowValue,
            safeEnd: lightHighValue,
            labels: [`当前 ${fmtNumber(minLight)}`, `下限 ${fmtNumber(lightLowValue)}`, `恢复 ${fmtNumber(lightHighValue)}`],
            currentClass: lightLow ? 'warn' : 'ok',
          }),
        },
        {
          key: 'fan',
          name: '风扇',
          active: !!actuators.fan,
          valueText: actuators.fan ? `ON ${Number(actuators.fan_pwm_percent ?? 0)}%` : 'OFF',
          hot: isAuto && tempHigh,
          reason: noNode ? '等待在线节点' :
            isAuto && tempHigh ? '温度高于上限，风扇开启' :
            isAuto && tempRecovered ? '温度已回落到恢复区间' :
            isAuto ? '温度接近控制区间' : '由手动控制状态显示',
          rule: `当前最高 ${fmtNumber(maxTemp)} ℃ / 恢复 ${fmtNumber(tempRecoverValue)} ℃ / 上限 ${fmtNumber(tempHighValue)} ℃ / PWM ${Number(actuators.fan_pwm_percent ?? 0)}%`,
          meterHtml: noNode ? '' : thresholdMeter({
            current: maxTemp,
            min: tempMin,
            max: tempMax,
            safeStart: tempMin,
            safeEnd: tempHighValue,
            markerStart: tempRecoverValue,
            markerEnd: tempHighValue,
            labels: [`当前 ${fmtNumber(maxTemp)} ℃`, `恢复 ${fmtNumber(tempRecoverValue)} ℃`, `上限 ${fmtNumber(tempHighValue)} ℃`],
            currentClass: tempHigh ? 'bad' : 'ok',
          }),
        },
        {
          key: 'pump',
          name: '水泵',
          active: !!actuators.pump,
          hot: isAuto && humidityLow,
          reason: noNode ? '等待在线节点' :
            isAuto && actuators.pump ? '湿度低于下限，正在喷水' :
            isAuto && humidityLow ? '湿度仍低，等待冷却或下一次触发' :
            isAuto ? '湿度处于安全区间' : '由手动控制状态显示',
          rule: `当前最低 ${fmtNumber(minHumidity)} % / 下限 ${fmtNumber(humidityLowValue)} % / 时长 ${config.pump_duration_sec ?? '-'} 秒`,
          meterHtml: noNode ? '' : thresholdMeter({
            current: minHumidity,
            min: 0,
            max: 100,
            safeStart: humidityLowValue,
            safeEnd: 100,
            labels: [`当前 ${fmtNumber(minHumidity)}%`, `下限 ${fmtNumber(humidityLowValue)}%`, '100%'],
            currentClass: humidityLow ? 'bad' : 'ok',
          }),
        },
      ];

      host.innerHTML = cards.map((card) => `
        <div class="actuator-card ${card.active ? 'on' : 'off'} ${card.hot ? 'warn' : ''}">
          <div class="actuator-top">
            <div class="actuator-name">${card.name}</div>
            <div class="actuator-state ${card.active ? 'on' : 'off'}">${card.valueText || (card.active ? 'ON' : 'OFF')}</div>
          </div>
          <div class="actuator-reason">${card.reason}</div>
          <div class="actuator-rule">${card.rule}</div>
          ${card.meterHtml}
        </div>
      `).join('');
    }

    function renderEvents(events) {
      const host = byId('events');
      if (!events || !events.length) {
        host.innerHTML = '<div class="event">暂无事件</div>';
        return;
      }
      host.innerHTML = events.slice().reverse().map((e) => {
        const cls = e.level === 'warn' ? 'warn' : e.level === 'bad' || e.level === 'error' ? 'bad' : 'ok';
        return `<div class="event ${cls}"><small>${e.level}</small>${e.text}</div>`;
      }).join('');
    }

    function renderStatus(data) {
      latestStatus = data;
      const gatewayOnline = data.gateway === 'online';
      setConnection(gatewayOnline, gatewayOnline ? '网关在线' : '网关离线');
      byId('runningValue').textContent = fmtRunning(data.running);
      byId('modeValue').textContent = data.mode || '-';
      byId('gatewayValue').textContent = data.gateway || '-';
      byId('onlineValue').textContent = String(Object.values(data.nodes || {}).filter((n) => n.online).length);
      byId('updatedAt').textContent = fmtTime(data.last_update_ms);

      const config = data.config || {};
      setInputIfIdle('light_low', config.light_low ?? '');
      setInputIfIdle('light_high', config.light_high ?? '');
      setInputIfIdle('humidity_low', config.humidity_low ?? '');
      setInputIfIdle('temperature_high', config.temperature_high ?? '');
      setInputIfIdle('pump_duration_sec', config.pump_duration_sec ?? '');
      setInputIfIdle('pump_cooldown_sec', config.pump_cooldown_sec ?? '');

      updateModeButtons(data.mode || 'safe');
      syncFanPwmControls(data);
      renderNodes(data.nodes || {}, config);
      renderActuators(data);
      renderEvents(data.events || []);
    }

    async function api(path, options = {}) {
      const res = await fetch(path, {
        headers: { 'Content-Type': 'application/json' },
        ...options,
      });
      const text = await res.text();
      let json = null;
      try { json = JSON.parse(text); } catch (_) {}
      if (!res.ok) {
        const msg = json && json.error ? json.error : text || res.statusText;
        throw new Error(msg);
      }
      return json || {};
    }

    async function postNoBody(path) {
      try {
        await api(path, { method: 'POST', body: '{}' });
        await loadStatus();
      } catch (err) {
        setConnection(false, err.message);
      }
    }

    async function setMode(mode) {
      try {
        await api('/api/mode', { method: 'POST', body: JSON.stringify({ mode }) });
        await loadStatus();
      } catch (err) {
        setConnection(false, err.message);
      }
    }

    async function saveConfig() {
      try {
        const payload = {
          light_low: Number(byId('light_low').value),
          light_high: Number(byId('light_high').value),
          humidity_low: Number(byId('humidity_low').value),
          temperature_high: Number(byId('temperature_high').value),
          pump_duration_sec: Number(byId('pump_duration_sec').value),
          pump_cooldown_sec: Number(byId('pump_cooldown_sec').value),
        };
        await api('/api/config', { method: 'POST', body: JSON.stringify(payload) });
        await loadStatus();
      } catch (err) {
        setConnection(false, err.message);
      }
    }

    async function controlDevice(device, action) {
      try {
        await api('/api/control', {
          method: 'POST',
          body: JSON.stringify({ device, action }),
        });
        await loadStatus();
      } catch (err) {
        setConnection(false, err.message);
      }
    }

    async function setFanPwmFromSlider() {
      try {
        await api('/api/control', {
          method: 'POST',
          body: JSON.stringify({
            device: 'fan',
            action: 'pwm',
            pwm: Number(byId('fanPwmRange').value),
          }),
        });
        await loadStatus();
      } catch (err) {
        setConnection(false, err.message);
        await loadStatus();
      }
    }

    async function loadStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        renderStatus(data);
      } catch (err) {
        setConnection(false, '后端离线');
        byId('runningValue').textContent = '未知';
        byId('modeValue').textContent = '-';
        byId('gatewayValue').textContent = 'offline';
        byId('onlineValue').textContent = '-';
      }
    }

    loadStatus();
    setInterval(loadStatus, 1000);
  </script>
</body>
</html>
